<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vortex Digital</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="style.css">
<style>
#select-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  text-align: center;
  padding: 20px;
}
.admin-options {
  display: flex;
  gap: 20px;
  margin-top: 30px;
  flex-wrap: wrap;
  justify-content: center;
}
.admin-card {
  cursor: pointer;
  padding: 30px 50px;
  border-radius: 12px;
  border: 1px solid #444;
  min-width: 160px;
  transition: 0.2s ease;
}
.admin-card:hover {
  transform: translateY(-3px);
}
</style>
</head>
<body>

<div id="select-screen">
  <h2>Select Admin</h2>
  <p>Choose which admin account to log in as.</p>
  <div class="admin-options">
    <div class="admin-card" onclick="selectAdmin('Mujtaba', 'vd-9247-ops.html')">
      <h3>Mujtaba</h3>
    </div>
    <div class="admin-card" onclick="selectAdmin('Anas', 'vd-9a57-ops-.html')">
      <h3>Anas</h3>
    </div>
  </div>
</div>

<script src="admin-logger.js"></script>
<script>
function safeLog() {
  try {
    if (typeof vxLogEvent === "function") {
      return vxLogEvent.apply(null, arguments);
    }
  } catch (e) { /* never let logging break the real feature */ }
  return Promise.resolve();
}

function selectAdmin(name, url) {
  safeLog(
    "admin_selected",
    "Admin Card Selected: " + name,
    { Admin_Selected: name },
    false
  ).finally(function () {
    window.location.href = url;
  });
}
</script>

</body>
</html>
