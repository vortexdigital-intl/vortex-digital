<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vortex Digital</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="style.css">
<style>
#select-screen, #restricted-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  text-align: center;
  padding: 20px;
}
#restricted-screen { display: none; }
.admin-options {
  display: flex;
  gap: 20px;
  margin-top: 30px;
  flex-wrap: wrap;
  justify-content: center;
}
.admin-card {
  position: relative;
  cursor: pointer;
  padding: 30px 50px;
  border-radius: 12px;
  border: 1px solid #444;
  min-width: 160px;
  transition: 0.2s ease;
}
.admin-card:hover {
  transform: translateY(-3px);
}
.admin-card-suspended {
  cursor: not-allowed;
  pointer-events: none;
  opacity: 0.45;
}
.admin-card-suspended:hover {
  transform: none;
}
.suspended-label {
  display: block;
  font-size: 18px;
  font-weight: 800;
  color: #ff5c5c;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-top: 10px;
}
.suspended-name {
  text-decoration: line-through;
  text-decoration-color: #ff5c5c;
  text-decoration-thickness: 3px;
}
.admin-tag {
  position: absolute;
  top: 6px;
  right: 10px;
  font-size: 10px;
  color: #9aa5c9;
  letter-spacing: 0.5px;
}
#restricted-screen input {
  padding: 14px;
  width: 260px;
  max-width: 80vw;
  border-radius: 8px;
  border: 1px solid #444;
  background: transparent;
  color: #fff;
  text-align: center;
  margin: 20px 0;
}
#restricted-screen button {
  padding: 14px 40px;
  border-radius: 30px;
  border: none;
  background: #3b6ef0;
  color: #fff;
  font-weight: 700;
  cursor: pointer;
}
#restricted-screen a {
  display: block;
  margin-top: 25px;
  color: #8a7dfc;
}
#restricted-error {
  color: #ff5c5c;
  min-height: 20px;
  font-size: 14px;
}
</style>
</head>
<body>

<div id="select-screen">
  <h2>Select Admin</h2>
  <p>Choose which admin account to log in as.</p>
  <div class="admin-options">
    <div class="admin-card admin-card-suspended">
      <h3 class="suspended-name">Mujtaba</h3>
      <span class="suspended-label">Suspended</span>
    </div>
    <div class="admin-card admin-card-suspended">
      <h3 class="suspended-name">Anas</h3>
      <span class="suspended-label">Suspended</span>
    </div>
    <div class="admin-card" onclick="openGate('Fahad Ansari', '219443', 'vf-ops.html')">
      <span class="admin-tag">EPB Admintraion Department</span>
      <h3>Fahad Ansari</h3>
    </div>
    <div class="admin-card" onclick="openGate('Hashir', 'PUT_CODE_HERE', 'vh-ops.html')">
      <h3>Hashir</h3>
    </div>
  </div>
</div>

<div id="restricted-screen">
  <h2>Restricted Access</h2>
  <p>Enter access code to continue as <b id="gate-name"></b>.</p>
  <input type="password" id="gate-input" placeholder="Access Code">
  <div id="restricted-error"></div>
  <button onclick="checkCode()">Enter</button>
  <a href="#" onclick="closeGate(); return false;">← Back to admin selection</a>
</div>

<script src="admin-logger.js"></script>
<script>
function safeLog() {
  try {
    if (typeof vxLogEvent === "function") {
      return vxLogEvent.apply(null, arguments);
    }
  } catch (e) { /* never let logging break the real feature */ }
  return Promise.resolve();
}

var currentGate = { name: "", code: "", url: "" };

function openGate(name, code, url) {
  currentGate = { name: name, code: code, url: url };
  document.getElementById("gate-name").textContent = name;
  document.getElementById("gate-input").value = "";
  document.getElementById("restricted-error").textContent = "";
  document.getElementById("select-screen").style.display = "none";
  document.getElementById("restricted-screen").style.display = "flex";
}

function closeGate() {
  document.getElementById("restricted-screen").style.display = "none";
  document.getElementById("select-screen").style.display = "flex";
}

function checkCode() {
  var entered = document.getElementById("gate-input").value.trim();
  if (entered === currentGate.code) {
    safeLog(
      "admin_selected",
      "Admin Card Selected: " + currentGate.name,
      { Admin_Selected: currentGate.name },
      false
    ).finally(function () {
      window.location.href = currentGate.url;
    });
  } else {
    document.getElementById("restricted-error").textContent = "Incorrect code. Try again.";
  }
}
</script>

</body>
</html>
